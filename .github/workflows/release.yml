name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      skip_publish:
        description: 'Skip npm publish (for testing)'
        type: boolean
        default: true
      skip_gpu:
        description: 'Skip GPU tests (alpha cuts — CPU/Metal matrix still gates)'
        type: boolean
        default: false
      dl_source_run_id:
        description: >-
          Resume the DL chain for a version whose archives ALREADY uploaded: the
          id of the run whose build-dl-flavor succeeded and whose chain failed
          after it. Runs only the L4 DL gate and the signed-manifest publish,
          against that run's archives and manifest. The pack is deterministic
          and the channel paths are write-once, so this is the one way to
          finish such a version. Empty for a normal release.
        type: string
        default: ''

jobs:
  build-and-test:
    name: Build & Test ${{ matrix.package }}
    if: inputs.dl_source_run_id == ''
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS
          - os: macos-14
            arch: arm64
            gpu: metal
            package: darwin-arm64
          - os: macos-15-intel
            arch: x64
            gpu: cpu
            package: darwin-x64

          # Linux x64
          - os: ubuntu-22.04
            arch: x64
            gpu: cpu
            package: linux-x64
          - os: ubuntu-22.04
            arch: x64
            gpu: cuda
            package: linux-x64-cuda
          - os: ubuntu-22.04
            arch: x64
            gpu: vulkan
            package: linux-x64-vulkan

          # Linux ARM64 (native runners)
          - os: ubuntu-22.04-arm
            arch: arm64
            gpu: cpu
            package: linux-arm64
          - os: ubuntu-22.04-arm
            arch: arm64
            gpu: cuda
            package: linux-arm64-cuda
          - os: ubuntu-22.04-arm
            arch: arm64
            gpu: vulkan
            package: linux-arm64-vulkan

          # Windows x64
          - os: windows-2022
            arch: x64
            gpu: cpu
            package: win32-x64
          - os: windows-2022
            arch: x64
            gpu: cuda
            package: win32-x64-cuda
          - os: windows-2022
            arch: x64
            gpu: vulkan
            package: win32-x64-vulkan

          # Windows ARM64 (cross-compiled from x64)
          - os: windows-2022
            arch: arm64
            gpu: cpu
            package: win32-arm64
            cross_compile: true
          - os: windows-2022
            arch: arm64
            gpu: vulkan
            package: win32-arm64-vulkan
            cross_compile: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Validate llama.cpp version
        run: node scripts/sync-llama-cpp.js --check
        shell: bash

      # Platform-specific build dependencies
      - name: Install build tools (Linux x64)
        if: runner.os == 'Linux' && matrix.arch == 'x64' && matrix.gpu == 'cpu'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Install build tools (Linux ARM64)
        if: runner.os == 'Linux' && matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      # CUDA 12.2.2 for x64 - must match L4 GPU driver (535.x supports max 12.2)
      # PTX compiled with newer CUDA won't run on older drivers
      - name: Provision CUDA toolkit (Linux x64)
        if: matrix.gpu == 'cuda' && runner.os == 'Linux' && matrix.arch == 'x64'
        uses: ./.github/actions/provision-cuda
        with:
          version: '12.2.2'
          arch: x64

      # CUDA 12.6 for ARM64 - no L4 testing, use latest available
      - name: Provision CUDA toolkit (Linux ARM64)
        if: matrix.gpu == 'cuda' && runner.os == 'Linux' && matrix.arch == 'arm64'
        uses: ./.github/actions/provision-cuda
        with:
          arch: arm64

      # Vulkan 1.4.x required for ARM64 (jakoch/vulkan-sdk-arm only has 1.4.x)
      - name: Install Vulkan SDK (Linux)
        if: matrix.gpu == 'vulkan' && runner.os == 'Linux'
        uses: jakoch/install-vulkan-sdk-action@v1.2.4
        with:
          vulkan_version: '1.4.341.1'
          install_runtime: true
          cache: false

      # Use default CUDA 12.6 for building (forward compatible with older drivers)
      - name: Provision CUDA toolkit (Windows)
        if: matrix.gpu == 'cuda' && runner.os == 'Windows'
        uses: ./.github/actions/provision-cuda
        with:
          arch: ${{ matrix.arch }}

      - name: Install Vulkan SDK (Windows)
        if: matrix.gpu == 'vulkan' && runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1.2.4
        with:
          vulkan_version: '1.4.341.1'
          install_runtime: true
          cache: false

      - name: Setup LLVM and Ninja for Windows ARM64 cross-compilation
        if: runner.os == 'Windows' && matrix.cross_compile == true
        shell: pwsh
        run: |
          choco install llvm ninja -y
          echo "CC=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "CXX=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Build
      - name: Install npm dependencies
        run: npm install --ignore-scripts

      # Compiler cache: reuse object files across releases. Linux/macOS use it via
      # CMAKE_*_COMPILER_LAUNCHER below. On Windows the default MSBuild generator
      # ignores COMPILER_LAUNCHER, so ccache there needs a Ninja switch — deferred
      # to the full-arch channel builds where it matters and can be validated
      # (lloyal.node#38), keeping this release's win32-x64-cuda build on the proven
      # MSBuild path. See lloyal.node#36.
      - name: Setup ccache
        if: matrix.cross_compile != true
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.package }}
          variant: ccache

      - name: Build native module (Native builds)
        if: matrix.cross_compile != true
        run: npm run build
        env:
          LLOYAL_GPU: ${{ matrix.gpu }}
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CMAKE_CUDA_COMPILER_LAUNCHER: ccache

      - name: Build native module (Windows ARM64 cross-compile)
        if: runner.os == 'Windows' && matrix.cross_compile == true
        shell: pwsh
        run: |
          $env:CMAKE_GENERATOR = "Ninja"
          $env:CMAKE_TOOLCHAIN_FILE = "${{ github.workspace }}/cmake/arm64-cross.cmake"
          npm run build
        env:
          LLOYAL_GPU: ${{ matrix.gpu }}
          ARCH: arm64

      # Create platform package
      - name: Create platform package
        shell: bash
        run: |
          node scripts/create-platform-package.js "${{ matrix.package }}" "${{ matrix.os }}" "${{ matrix.arch }}"

      # Test platform package (skip for cross-compiled packages - can't run ARM64 on x64)
      - name: Cache test models
        if: matrix.cross_compile != true
        uses: actions/cache@v4
        with:
          path: models/
          # v2: + SmolVLM-256M pair (multimodal CI tier). actions/cache never
          # re-saves on a hit — bump the key when matrix.json gains files.
          key: test-models-v2

      - name: Download test models
        if: matrix.cross_compile != true
        run: bash scripts/download-test-models.sh

      - name: Install platform package locally
        if: matrix.cross_compile != true
        shell: bash
        run: |
          npm install ./packages/${{ matrix.package }}
          rm -rf build/Release
          echo "Installed package contents:"
          ls -la node_modules/@lloyal-labs/lloyal.node-${{ matrix.package }}/bin/ || echo "Package not found in node_modules"

      - name: Verify platform package loading (Unix)
        if: runner.os != 'Windows' && matrix.cross_compile != true && matrix.gpu != 'cuda'
        shell: bash
        run: |
          # Set LD_LIBRARY_PATH to find sibling .so files (Linux CUDA/Vulkan)
          PKG_BIN="$PWD/node_modules/@lloyal-labs/lloyal.node-${{ matrix.package }}/bin"
          export LD_LIBRARY_PATH="${PKG_BIN}:${LD_LIBRARY_PATH:-}"
          echo "LD_LIBRARY_PATH: $LD_LIBRARY_PATH"
          node -e "
            const { loadBinary } = require('./dist');
            const addon = loadBinary();
            console.log('✓ Platform package loaded successfully');
            console.log('  Exports:', Object.keys(addon));
          "
        env:
          LLOYAL_GPU: ${{ matrix.gpu }}
          LLOYAL_NO_FALLBACK: '1'

      - name: Verify platform package loading (Windows)
        if: runner.os == 'Windows' && matrix.cross_compile != true && matrix.gpu != 'cuda'
        shell: pwsh
        run: |
          # Add package bin to PATH for DLL discovery
          $pkgBin = "$PWD\node_modules\@lloyal-labs\lloyal.node-${{ matrix.package }}\bin"
          $env:PATH = "$pkgBin;$env:PATH"

          # Add Vulkan SDK runtime to PATH if available
          if ($env:VULKAN_SDK) {
            $env:PATH = "$env:VULKAN_SDK\Bin;$env:PATH"
            # Vulkan runtime is in runtime\x64, not Bin
            if (Test-Path "$env:VULKAN_SDK\runtime\x64\vulkan-1.dll") {
              $env:PATH = "$env:VULKAN_SDK\runtime\x64;$env:PATH"
              Write-Host "Added Vulkan runtime to PATH: $env:VULKAN_SDK\runtime\x64"
            }
          }

          # Add CUDA runtime to PATH if available
          if ($env:CUDA_PATH) {
            $env:PATH = "$env:CUDA_PATH\bin;$env:PATH"
            Write-Host "Added CUDA bin to PATH: $env:CUDA_PATH\bin"
          }

          Write-Host "Package bin: $pkgBin"
          Write-Host "VULKAN_SDK: $env:VULKAN_SDK"
          Write-Host "CUDA_PATH: $env:CUDA_PATH"
          node -e "
            const { loadBinary } = require('./dist');
            const addon = loadBinary();
            console.log('✓ Platform package loaded successfully');
            console.log('  Exports:', Object.keys(addon));
          "
        env:
          LLOYAL_GPU: ${{ matrix.gpu }}
          LLOYAL_NO_FALLBACK: '1'

      # Integration tests on GitHub runners (no GPU hardware)
      # GPU tests (CUDA/Vulkan) run separately via gpu-test.yml on Cloud Run with NVIDIA L4
      - name: Run integration tests (Windows)
        if: runner.os == 'Windows' && matrix.gpu == 'cpu' && matrix.cross_compile != true
        shell: pwsh
        run: |
          $pkgBin = "$PWD\node_modules\@lloyal-labs\lloyal.node-${{ matrix.package }}\bin"
          $env:PATH = "$pkgBin;$env:PATH"
          if ($env:VULKAN_SDK) {
            $env:PATH = "$env:VULKAN_SDK\Bin;$env:PATH"
            if (Test-Path "$env:VULKAN_SDK\runtime\x64\vulkan-1.dll") {
              $env:PATH = "$env:VULKAN_SDK\runtime\x64;$env:PATH"
            }
          }
          if ($env:CUDA_PATH) { $env:PATH = "$env:CUDA_PATH\bin;$env:PATH" }
          npm run test:integration
        timeout-minutes: 5
        env:
          LLOYAL_GPU: ${{ matrix.gpu }}
          LLOYAL_NO_FALLBACK: '1'

      # Skip Metal integration tests on CI - GitHub Actions paravirtual GPU (Apple5)
      # has driver bugs with strided memory access (NeoX RoPE kernel).
      # Metal packages are built and verified to load, but GPU tests are skipped.
      - name: Run integration tests (Unix)
        if: runner.os != 'Windows' && matrix.gpu == 'cpu'
        run: |
          PKG_BIN="$PWD/node_modules/@lloyal-labs/lloyal.node-${{ matrix.package }}/bin"
          export LD_LIBRARY_PATH="${PKG_BIN}:${LD_LIBRARY_PATH:-}"
          npm run test:integration
        timeout-minutes: 5
        env:
          LLOYAL_GPU: ${{ matrix.gpu }}
          LLOYAL_NO_FALLBACK: '1'

      # Upload package artifact for publish job
      - name: Upload platform package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.package }}
          path: packages/${{ matrix.package }}/
          retention-days: 1

  # GPU Integration Tests (reusable workflow)
  gpu-tests:
    name: GPU Tests
    needs: build-and-test
    if: github.event_name == 'push' || inputs.skip_gpu != true
    uses: ./.github/workflows/gpu-test.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  # ── BACKEND_DL flavor (the additive R2 channel — lloyal.node#38/#39) ──
  # Same v* tag as the npm matrix (one version drives both channels), but
  # DELIBERATELY absent from the npm publish job's `needs`: a flavor
  # failure can never block the npm release. Upload/publish steps gate on
  # the CI service token being configured, so this job degrades to a pure
  # build+gates check until the binaries channel is live.
  build-dl-flavor:
    name: Build BACKEND_DL flavor (linux-x64-dl)
    # ubuntu-22.04 is deliberate, not inertia:
    # (a) glibc floor — a prebuilt's minimum glibc is set by the BUILD
    #     machine. The whole npm matrix builds on 22.04 (glibc 2.35) and
    #     the L4 rig image is ubuntu22.04-based; building this flavor on
    #     24.04 (glibc 2.39) would silently raise the pack's floor above
    #     what those hosts can dlopen — the silent-failure class this
    #     flavor exists to kill.
    # (b) provision-cuda's NVIDIA repo URLs are ubuntu2204-hardcoded, and
    #     CUDA 12.9.1 availability was verified against that repo.
    # (c) 22.04 brownouts begin 2026-09-17 (runner-images#14254). The
    #     migration is a named follow-on for the WHOLE matrix at once:
    #     ubuntu-24.04 runners building inside an ubuntu:22.04 container,
    #     so the glibc floor survives the runner-image move.
    runs-on: ubuntu-22.04
    if: inputs.dl_source_run_id == ''
    outputs:
      uploaded: ${{ steps.upload.outputs.uploaded }}
      version: ${{ steps.pack.outputs.version }}
      archive_url: ${{ steps.upload.outputs.archive_url }}
      archive_sha256: ${{ steps.pack.outputs.archive_sha256 }}
      runtime_url: ${{ steps.upload.outputs.runtime_url }}
      runtime_sha256: ${{ steps.pack.outputs.runtime_sha256 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate llama.cpp version
        run: node scripts/sync-llama-cpp.js --check

      # The 11-arch fatbin build needs headroom the stock runner image
      # doesn't leave after preinstalled SDKs.
      - name: Free runner disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc

      # 12.9.1 = the last 12.x toolkit: emits sm_100a/120a/121a (Blackwell)
      # while 12.x cubins keep minor-version compat with the whole 12.x
      # driver fleet (13.x would drop the 50/61/70-virtual floor AND
      # require 13-era drivers). Version-scoped cache coexists with the
      # npm matrix's 12.2.2.
      - name: Provision CUDA toolkit
        uses: ./.github/actions/provision-cuda
        with:
          version: '12.9.1'
          arch: x64

      - name: Install zstd (pack compression)
        run: sudo apt-get install -y -qq zstd

      # The ccache-action apt-installs ccache (4.5.1 on ubuntu-22.04),
      # which predates nvcc support (added in 4.11) — device compilations,
      # the bulk of this job's 99 minutes, would never cache. Put a modern
      # static ccache on /usr/local/bin, which precedes /usr/bin in PATH,
      # so the CMake launchers resolve it.
      - name: Install nvcc-capable ccache
        run: |
          curl -sSL https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-linux-x86_64-glibc.tar.xz \
            | tar -xJ --strip-components=1 -C /tmp ccache-4.13.6-linux-x86_64-glibc/ccache
          sudo install -m 755 /tmp/ccache /usr/local/bin/ccache
          ccache --version | head -1

      # Full-arch CUDA is the 2h-class build (#36); ccache makes
      # re-releases sane. Key is flavor-scoped — never shares npm objects.
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-x64-dl
          variant: ccache
          # Default 500M was 44% full from HOST objects alone on the first
          # build; CUDA artifacts need headroom. (Known gap: the installed
          # ccache 4.5.1 predates nvcc support — device compilations are
          # NOT cached yet; tracked as a follow-on.)
          max-size: 3G

      - name: Install npm dependencies
        run: npm install --ignore-scripts

      - name: Build BACKEND_DL flavor
        # Log to a file so the collision gate below can inspect it; pipefail
        # keeps the build's own exit code authoritative through the tee.
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee dl-build.log
        env:
          LLOYAL_GPU: cuda
          LLOYAL_BACKEND_DL: '1'
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CMAKE_CUDA_COMPILER_LAUNCHER: ccache

      # nvcc reports a colliding flag (same option passed twice, last wins)
      # as a WARNING and proceeds — which is how the v3.1.1 fix shipped
      # silently overridden (--compress-mode passed by us AND by ggml's
      # GGML_CUDA_COMPRESSION_MODE machinery). Any redefinition means some
      # build flag is not what we think it is: fail loud, immediately.
      - name: Gate — no nvcc flag collisions
        run: |
          if grep -n "incompatible redefinition" dl-build.log; then
            echo "::error::nvcc flag redefinition detected — a CUDA build flag is being silently overridden"
            exit 1
          fi
          echo "no nvcc flag collisions"

      # Per-arch INDEPENDENT gates (cuobjdump SASS + PTX asserts, CPU
      # variant count, arch-mirror drift) + deterministic pack + manifest.
      - name: Assemble pack + arch gates
        id: pack
        run: |
          node scripts/create-dl-pack.js
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=$(node -p "require('./packs/manifest.json').archive.sha256")" >> "$GITHUB_OUTPUT"
          echo "runtime_sha256=$(node -p "require('./packs/manifest.json').runtimeArchive.sha256")" >> "$GITHUB_OUTPUT"

      # CPU loader smoke on the GPU-less runner: assert not just that A
      # variant registered but WHICH — ggml logs the winning module path
      # at INFO; anything below haswell here is a scoring regression that
      # "something loaded" would wave through. The CUDA module silently
      # skips on this runner (no driver) — expected; asserted on L4 below.
      - name: CPU variant selection smoke
        run: |
          mkdir -p /tmp/dl-smoke
          tar --zstd -xf packs/linux-x64-dl.tar.zst -C /tmp/dl-smoke
          set -o pipefail
          LLOYAL_BACKEND_DIR=/tmp/dl-smoke node -e "
            const { loadBinary } = require('./dist');
            const devs = loadBinary().listDevices();
            console.log('devices:', JSON.stringify(devs));
            if (!devs.some(d => d.type === 'cpu')) { console.error('no CPU device registered'); process.exit(1); }
          " 2> /tmp/dl-smoke/stderr.log
          cat /tmp/dl-smoke/stderr.log
          grep -E 'libggml-cpu-(haswell|skylakex|cannonlake|cascadelake|icelake|cooperlake|zen4|alderlake|sapphirerapids)\.so' /tmp/dl-smoke/stderr.log \
            || { echo "::error::CPU variant selection regressed — no >=haswell variant won (see stderr above)"; exit 1; }

      # Write-once uploads via the binaries channel (worker presigns
      # single PUTs; bytes go straight to R2). Skipped with a notice until
      # the CI service token is configured — the manifest is signed and
      # published ONLY by publish-dl, after the L4 gate passes.
      # Secrets are step-scoped (matching NODE_AUTH_TOKEN in the npm job):
      # job-level env would expose the service token to every step's
      # process environment, including third-party actions and the whole
      # build toolchain — and this token can mint signed manifests.
      - name: Upload archives to R2 (presigned)
        id: upload
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          # skip_publish dry-runs must not touch the channel: the paths are
          # write-once, so even an upload-without-publish would 409 the
          # REAL release's upload step at this version. Mirrors the npm
          # publish job's gate; a deliberate full-path validation is a
          # dispatch with skip_publish unchecked. uploaded=false makes
          # gpu-tests-dl + publish-dl skip too.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.skip_publish }}" = "true" ]; then
            echo "::notice::skip_publish dry-run — DL upload/publish skipped (build + arch gates + CPU smoke still validated)"
            echo "uploaded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Three-state gate: both secrets absent = pre-activation, degrade
          # to build+gates with a notice. Exactly ONE set = someone tried
          # to activate the channel and misconfigured it — fail loud and
          # named, never degrade (a silent skip would hide a typo'd secret
          # behind green releases indefinitely).
          if [ -z "$CF_ACCESS_CLIENT_ID" ] && [ -z "$CF_ACCESS_CLIENT_SECRET" ]; then
            echo "::notice::binaries-channel service token not configured — skipping upload (build+gates still validated)"
            echo "uploaded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$CF_ACCESS_CLIENT_ID" ] || [ -z "$CF_ACCESS_CLIENT_SECRET" ]; then
            echo "::error::partial binaries-channel config — exactly one of CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET is set; set both (activate) or neither (skip)"
            exit 1
          fi
          VERSION=$(node -p "require('./package.json').version")
          presign_and_put () {
            local file="$1"
            local key="v1/binaries/lloyal.node/${VERSION}/$(basename "$file")"
            local size sha resp url checksum
            size=$(stat -c%s "$file")
            sha=$(sha256sum "$file" | cut -d' ' -f1)
            resp=$(curl -sfS -X POST https://api.lloyal.ai/v1/binaries/uploads \
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              -H "content-type: application/json" \
              -d "{\"key\":\"$key\",\"sizeBytes\":$size,\"sha256\":\"$sha\"}")
            url=$(jq -re .url <<<"$resp")
            # Signed into the presign — the PUT must carry it byte-exact, and
            # R2 validates the body against it (the URL is bound to these bytes).
            checksum=$(jq -re '.headers["x-amz-checksum-sha256"]' <<<"$resp")
            curl -sfS -X PUT -H "x-amz-checksum-sha256: $checksum" \
              --upload-file "$file" "$url" > /dev/null
            echo "https://apps.lloyal.ai/$key"
          }
          ARCHIVE_URL=$(presign_and_put "packs/linux-x64-dl.tar.zst")
          RUNTIME_FILE=$(node -p "require('./packs/manifest.json').runtimeArchive.file")
          RUNTIME_URL=$(presign_and_put "packs/${RUNTIME_FILE}")
          {
            echo "uploaded=true"
            echo "archive_url=$ARCHIVE_URL"
            echo "runtime_url=$RUNTIME_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: dl-manifest
          path: packs/manifest.json
          retention-days: 7

  # The L4 rig consumes the pack THE PRODUCT'S WAY (design §3.3 path-2):
  # the 12.2.2-runtime image fails the runtime gate BY CONSTRUCTION →
  # companion archive fetch → co-extract → RPATH resolution → device
  # assertion → the full model-matrix inference suites. Strictly additive
  # to the rig's two existing consumers: new script, new JOB_NAME, zero
  # edits to run-gpu-tests.sh or existing job definitions.
  # Resume: the archives and manifest of an EARLIER run of this same version,
  # whose DL chain failed after its upload. The write-once paths refuse a second
  # upload and the pack is deterministic, so the uploaded bytes ARE the pack;
  # what is missing is the L4 gate and the signing act, which run below exactly
  # as in a normal release, fed from this job instead of build-dl-flavor. The
  # manifest artifact carries the file names and hashes; the URLs derive from
  # the version, which must be the version this checkout declares.
  dl-source:
    name: DL resume source (archives from an earlier run)
    if: github.event_name == 'workflow_dispatch' && inputs.dl_source_run_id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.src.outputs.version }}
      archive_url: ${{ steps.src.outputs.archive_url }}
      archive_sha256: ${{ steps.src.outputs.archive_sha256 }}
      runtime_url: ${{ steps.src.outputs.runtime_url }}
      runtime_sha256: ${{ steps.src.outputs.runtime_sha256 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download the source run's manifest artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ inputs.dl_source_run_id }}" -R "${{ github.repository }}" -n dl-manifest -D dl-manifest

      - name: Resolve the archives the manifest names; refuse a version mismatch or a published manifest
        id: src
        run: |
          set -o pipefail
          VERSION=$(node -p "require('./package.json').version")
          M=dl-manifest/manifest.json
          MV=$(jq -r .version "$M")
          test "$MV" = "$VERSION" || { echo "::error::manifest is for $MV but this checkout is $VERSION"; exit 1; }
          BASE="https://apps.lloyal.ai/v1/binaries/lloyal.node/$VERSION"
          A=$(jq -r .archive.file "$M"); R=$(jq -r .runtimeArchive.file "$M")
          for f in "$A" "$R"; do
            curl -sfI "$BASE/$f" > /dev/null || { echo "::error::$BASE/$f is not on the channel — nothing to resume"; exit 1; }
          done
          if curl -sfI "$BASE/linux-x64-dl.manifest.json" > /dev/null; then
            echo "::error::a signed manifest is already published for $VERSION"; exit 1
          fi
          {
            echo "version=$VERSION"
            echo "archive_url=$BASE/$A"
            echo "archive_sha256=$(jq -r .archive.sha256 "$M")"
            echo "runtime_url=$BASE/$R"
            echo "runtime_sha256=$(jq -r .runtimeArchive.sha256 "$M")"
          } >> "$GITHUB_OUTPUT"

      # publish-dl downloads `dl-manifest` from THIS run, whichever job made it.
      - name: Carry the manifest as this run's artifact
        uses: actions/upload-artifact@v4
        with:
          name: dl-manifest
          path: dl-manifest/manifest.json
          retention-days: 1

  gpu-tests-dl:
    name: GPU Tests DL (L4, path-2 consumer)
    needs: [build-dl-flavor, dl-source]
    if: ${{ !cancelled() && (needs.build-dl-flavor.outputs.uploaded == 'true' || needs.dl-source.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout infrastructure scripts
        uses: actions/checkout@v4
        with:
          repository: lloyal-ai/lloyal-infra
          token: ${{ secrets.INFRA_REPO_PAT }}
          path: ci

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Compile TypeScript (src + tests)
        run: |
          # npm install, NOT npm ci. The lockfile carries version-less stubs
          # for this version's 13 platform packages (they don't exist on the
          # registry until the publish job runs, so lockfile regeneration can
          # only stub them). npm ci validates such stubs AGAINST THE REGISTRY:
          # while the version 404s the stubs pass as unresolvable optionals,
          # but the moment publish lands, the same lockfile fails EUSAGE
          # ("lock file's X@ does not satisfy X@<version>"). This job runs
          # after the ~2h DL build — always post-publish — so npm ci here
          # fails every release. Proven on v3.1.0: gpu-test.yml's identical
          # step passed at 09:25 (pre-publish), this one failed at 09:59
          # (publish landed 09:36).
          npm install --ignore-scripts
          npm run build:ts
          npm run build:test

      - name: Build and push DL test image
        run: |
          IMAGE="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_AR_REPO }}/gpu-tests:${{ github.sha }}-dl"
          docker build -f ci/Dockerfile.dl-tests -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy and run DL GPU tests
        run: bash ci/deploy-gpu-tests.sh
        env:
          GCP_REGION: ${{ secrets.GCP_REGION }}
          GCP_SA_EMAIL: ${{ secrets.GCP_SA_EMAIL }}
          JOB_NAME: lloyal-gpu-test-dl
          EXTRA_ENV_VARS: "LLOYAL_PACK_URL=${{ needs.build-dl-flavor.outputs.archive_url || needs.dl-source.outputs.archive_url }},LLOYAL_PACK_SHA256=${{ needs.build-dl-flavor.outputs.archive_sha256 || needs.dl-source.outputs.archive_sha256 }},LLOYAL_RUNTIME_URL=${{ needs.build-dl-flavor.outputs.runtime_url || needs.dl-source.outputs.runtime_url }},LLOYAL_RUNTIME_SHA256=${{ needs.build-dl-flavor.outputs.runtime_sha256 || needs.dl-source.outputs.runtime_sha256 }}"

  # The publish act: sign + create-once the manifest — until this runs,
  # the uploaded archives are unverifiable ⇒ effectively unpublished. Any
  # red job upstream ⇒ no signed manifest for this version; npm unaffected.
  publish-dl:
    name: Publish DL manifest (signed)
    needs: [build-dl-flavor, dl-source, gpu-tests-dl]
    if: ${{ !cancelled() && needs.gpu-tests-dl.result == 'success' && (needs.build-dl-flavor.outputs.uploaded == 'true' || needs.dl-source.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      # Explicit path: correctness here otherwise rests on two chained
      # implicit defaults (upload's LCA flattening + download's root
      # extraction), and this is the signing act — the worst place to
      # discover a default shifted across an actions major.
      - name: Download manifest artifact
        uses: actions/download-artifact@v4
        with:
          name: dl-manifest
          path: dl-manifest

      - name: Publish signed manifest
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          # Default run: shell is `bash -e` WITHOUT pipefail — a failed curl
          # would feed empty input to the trailing jq, which exits 0, and
          # the SIGNING act would report success without publishing.
          set -o pipefail
          VERSION="${{ needs.build-dl-flavor.outputs.version || needs.dl-source.outputs.version }}"
          jq -n --arg v "$VERSION" --slurpfile m dl-manifest/manifest.json \
            '{version: $v, platform: "linux-x64-dl", manifest: $m[0]}' \
          | curl -sfS -X POST https://api.lloyal.ai/v1/binaries/publish \
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              -H "content-type: application/json" \
              -d @- | jq .

  publish:
    name: Publish all packages
    needs: [build-and-test, gpu-tests]
    runs-on: ubuntu-latest
    # Publish when the matrix succeeded and GPU tests either succeeded or were
    # deliberately skipped (alpha cuts) — `success()` alone would treat the
    # skip as a veto. A GPU FAILURE still blocks.
    if: >-
      !cancelled() &&
      needs.build-and-test.result == 'success' &&
      (needs.gpu-tests.result == 'success' || needs.gpu-tests.result == 'skipped') &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.skip_publish))
    permissions:
      contents: read
      id-token: write  # Required for npm provenance

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Download all platform package artifacts
      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          path: packages/
          pattern: package-*
          merge-multiple: false

      - name: List downloaded packages
        run: |
          echo "Downloaded platform packages:"
          ls -la packages/
          for dir in packages/package-*/; do
            echo "  - $(basename $dir): $(ls $dir)"
          done

      # Publish platform packages
      - name: Publish platform packages
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Publishing version: $VERSION"

          # Determine npm tag based on version
          if [[ "$VERSION" == *-alpha* ]]; then
            NPM_TAG="alpha"
          elif [[ "$VERSION" == *-beta* ]]; then
            NPM_TAG="beta"
          elif [[ "$VERSION" == *-rc* ]]; then
            NPM_TAG="rc"
          else
            NPM_TAG="latest"
          fi

          echo "Using npm tag: $NPM_TAG"

          # Publish each platform package
          for pkg_dir in packages/package-*/; do
            pkg_name=$(basename "$pkg_dir" | sed 's/^package-//')
            echo ""
            echo "Publishing @lloyal-labs/lloyal.node-${pkg_name}..."
            cd "$pkg_dir"
            npm publish --access public --tag "$NPM_TAG" --provenance
            cd - > /dev/null
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Build TypeScript before publishing main package
      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build TypeScript
        run: npm run build:ts

      - name: Sync package versions
        run: node scripts/sync-versions.js

      - name: Publish main package
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-alpha* ]]; then
            npm publish --tag alpha --access public --provenance
          elif [[ "$VERSION" == *-beta* ]]; then
            npm publish --tag beta --access public --provenance
          elif [[ "$VERSION" == *-rc* ]]; then
            npm publish --tag rc --access public --provenance
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
