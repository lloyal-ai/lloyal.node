# The judge runs locally, on the committer's own login, before every commit. A pull request is accepted
# only when every commit carries the record hickey wrote into its message. Seconds, no model, no native build.
name: gate

on:
  pull_request:
    branches: [ main ]

jobs:
  carried:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - name: Every commit carries the gate's record
        run: npx hickey carried "origin/${{ github.base_ref }}...HEAD"
